[supervisord]
nodaemon=true
user=root
logfile=/var/www/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; RPC-интерфейс: без него `supervisorctl` (status / restart <program>) не работает.
; Путь сокета совпадает с дефолтом supervisorctl, поэтому он подключается без флагов.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:octane]
process_name=%(program_name)s
command=php /var/www/artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8080 --watch
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/octane.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=5

[program:worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=5

[program:scheduler]
process_name=%(program_name)s
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=5

[program:nutgram]
process_name=%(program_name)s
command=php /var/www/artisan nutgram:listen
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/nutgram.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=5

[program:logs]
process_name=%(program_name)s
; Агрегатор: тейлит per-program лог-файлы, префиксует строки и отдаёт их в stdout,
; который supervisor через stdout_logfile=/dev/stderr направляет в поток контейнера
; (его забирает `docker compose logs`).
; ВАЖНО: mawk по умолчанию блок-буферизует ВВОД, поэтому одиночные строки логов
; застревают в буфере и не доходят до контейнера. Флаг `-W interactive` включает
; построчное чтение stdin и небуферизованный вывод — без него агрегатор «молчит».
command=bash -c "tail -n 0 -F /var/www/storage/logs/octane.log | mawk -W interactive '{ print \"[OCTANE] \" $0 }' & tail -n 0 -F /var/www/storage/logs/worker.log | mawk -W interactive '{ print \"[WORKER] \" $0 }' & tail -n 0 -F /var/www/storage/logs/scheduler.log | mawk -W interactive '{ print \"[SCHEDULER] \" $0 }' & tail -n 0 -F /var/www/storage/logs/nutgram.log | mawk -W interactive '{ print \"[NUTGRAM] \" $0 }' & wait"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stopwaitsecs=5
; bash -c '... & ... & wait' порождает группу дочерних tail/mawk. Без этих флагов
; supervisor шлёт сигнал только bash, а tail/mawk осиротеют и при restart накопятся.
; stopasgroup шлёт SIGTERM всей группе процессов, killasgroup — SIGKILL по таймауту.
stopasgroup=true
killasgroup=true
